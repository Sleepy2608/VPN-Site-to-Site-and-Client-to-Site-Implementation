# ==============================================================================
# strongSwan IPsec Configuration: HQ Gateway (VM-HQ-GW)
# Đường dẫn triển khai: /etc/ipsec.conf
# Mô hình: Site-to-Site IKEv2 Tunnel (HQ <=> Branch LAN)
# ==============================================================================

config setup
    # Mức độ ghi log chi tiết cho tiến trình charon daemon
    charondebug="ike 1, knl 1, cfg 0"
    uniqueids=yes

# Định nghĩa kết nối đường hầm Site-to-Site giữa HQ và Chi nhánh
conn hq-to-branch
    # Sử dụng chuẩn giao thức IKEv2 (Internet Key Exchange version 2)
    keyexchange=ikev2

    # Tự động khởi tạo kết nối khi khởi động dịch vụ
    auto=start

    # Phương thức xác thực: Pre-Shared Key (Khóa chia sẻ trước)
    authby=secret
    type=tunnel

    # --------------------------------------------------------------------------
    # THÔNG SỐ ĐẦU CUỐI PHÍA TRỤ SỞ (HQ - LOCAL ENDPOINT)
    # --------------------------------------------------------------------------
    left=172.16.1.10
    leftsubnet=192.168.10.0/24
    leftid=172.16.1.10

    # --------------------------------------------------------------------------
    # THÔNG SỐ ĐẦU CUỐI PHÍA CHI NHÁNH (BRANCH - REMOTE ENDPOINT)
    # --------------------------------------------------------------------------
    right=172.16.1.20
    rightsubnet=192.168.20.0/24
    rightid=172.16.1.20

    # --------------------------------------------------------------------------
    # THUẬT TOÁN MẬT MÃ (CIPHER SUITES)
    # --------------------------------------------------------------------------
    # Giai đoạn 1 (IKE SA): Trao đổi khóa và xác thực đường hầm
    # Mã hóa: AES-256-GCM (128-bit ICV) | Toàn vẹn: SHA-256 | DH Group: MODP-2048
    ike=aes256gcm16-sha256-modp2048!

    # Giai đoạn 2 (CHILD SA / ESP): Mã hóa tải trọng dữ liệu mạng LAN
    esp=aes256gcm16-sha256-modp2048!

    # --------------------------------------------------------------------------
    # CƠ CHẾ PHÁT HIỆN MẤT KẾT NỐI (DEAD PEER DETECTION - DPD)
    # --------------------------------------------------------------------------
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=120s

    # Giữ đường hầm luôn mở
    closeaction=restart
