# ==============================================================================
# strongSwan IPsec Configuration: Branch Gateway (VM-Branch-GW)
# Đường dẫn triển khai: /etc/ipsec.conf
# Mô hình: Site-to-Site IKEv2 Tunnel (Branch <=> HQ LAN)
# ==============================================================================

config setup
    # Mức độ ghi log chi tiết cho tiến trình charon daemon
    charondebug="ike 1, knl 1, cfg 0"
    uniqueids=yes

# Định nghĩa kết nối đường hầm Site-to-Site từ Chi nhánh về Trụ sở HQ
conn branch-to-hq
    # Sử dụng chuẩn giao thức IKEv2
    keyexchange=ikev2

    # Branch chủ động thiết lập và kết nối lại với HQ.
    auto=start

    # Phương thức xác thực: Pre-Shared Key (Khóa chia sẻ trước)
    authby=secret
    type=tunnel

    # --------------------------------------------------------------------------
    # THÔNG SỐ ĐẦU CUỐI PHÍA CHI NHÁNH (BRANCH - LOCAL ENDPOINT)
    # --------------------------------------------------------------------------
    left=172.16.1.20
    leftsubnet=10.74.20.0/24
    leftid=172.16.1.20

    # --------------------------------------------------------------------------
    # THÔNG SỐ ĐẦU CUỐI PHÍA TRỤ SỞ (HQ - REMOTE ENDPOINT)
    # --------------------------------------------------------------------------
    right=172.16.1.10
    rightsubnet=10.74.10.0/24
    rightid=172.16.1.10

    # --------------------------------------------------------------------------
    # THUẬT TOÁN MẬT MÃ (CIPHER SUITES) - ĐỒNG BỘ 100% VỚI HQ GATEWAY
    # --------------------------------------------------------------------------
    # Giai đoạn 1 (IKE SA): Trao đổi khóa và xác thực đường hầm
    ike=aes256gcm16-prfsha256-modp2048!

    # Giai đoạn 2 (CHILD SA / ESP): Mã hóa tải trọng dữ liệu mạng LAN
    esp=aes256gcm16-modp2048!

    # --------------------------------------------------------------------------
    # CƠ CHẾ PHÁT HIỆN MẤT KẾT NỐI (DEAD PEER DETECTION - DPD)
    # --------------------------------------------------------------------------
    dpdaction=restart
    dpddelay=30s

    # Giữ đường hầm luôn mở
    closeaction=restart
