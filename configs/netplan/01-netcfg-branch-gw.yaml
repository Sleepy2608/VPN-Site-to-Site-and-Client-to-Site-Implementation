# Cấu hình Netplan cho VM-Branch-GW (Văn phòng Chi nhánh)
# Card eth0: Kết nối vào mạng WAN giả lập (WAN-Net)
# Card eth1: Kết nối vào mạng LAN chi nhánh (Branch-LAN-Net)
network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      addresses:
        - 172.16.1.20/24
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8
    eth1:
      addresses:
        - 192.168.20.1/24

