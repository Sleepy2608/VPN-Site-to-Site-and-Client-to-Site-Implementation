# Armbian Branch-GW; sửa NIC thực tế và renderer theo image (Minimal: networkd).
# Card eth0: Kết nối vào mạng WAN giả lập (WAN-Net)
# Card eth1: Kết nối vào mạng LAN chi nhánh (Branch-LAN-Net)
network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      dhcp4: false
      dhcp6: false
      addresses:
        - 172.16.1.20/24
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8
    eth1:
      dhcp4: false
      dhcp6: false
      addresses:
        - 10.74.20.1/24

