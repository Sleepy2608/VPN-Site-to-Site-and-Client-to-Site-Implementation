# Armbian Desktop Branch-PC (VM có GUI); sửa eth0 thành NIC LAN thực tế.
# Card eth0: Kết nối vào mạng LAN chi nhánh (Branch-LAN-Net)
network:
  version: 2
  renderer: NetworkManager
  ethernets:
    eth0:
      dhcp4: false
      dhcp6: false
      addresses:
        - 192.168.20.50/24
      routes:
        - to: default
          via: 192.168.20.1
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8

