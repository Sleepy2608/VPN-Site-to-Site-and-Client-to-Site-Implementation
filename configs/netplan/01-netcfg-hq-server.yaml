# Cấu hình Netplan cho VM-HQ-Server (Máy chủ Web/Internal Portal)
# Card eth0: Kết nối vào mạng LAN trụ sở (HQ-LAN-Net)
network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      addresses:
        - 192.168.10.50/24
      routes:
        - to: default
          via: 192.168.10.1
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8

