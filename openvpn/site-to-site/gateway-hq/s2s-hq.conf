# ==============================================================================
# OpenVPN Server Configuration: Site-to-Site Routed Tunnel
# Triển khai trên: VM-HQ-GW (Trụ sở chính)
# Đường dẫn hệ thống: /etc/openvpn/server/server-s2s.conf
# ==============================================================================

# Cổng lắng nghe và giao thức (sử dụng port riêng biệt 1195 để phân tách với C2S 1194)
port 1195
proto udp

# Tên interface ảo của đường hầm S2S (tun1 trên HQ GW)
dev tun1

# Chuỗi chứng chỉ X.509 và khóa mật mã của HQ S2S Gateway
ca /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/hq-s2s-gw.crt
key /etc/openvpn/server/hq-s2s-gw.key
dh /etc/openvpn/server/dh.pem

# Khóa bảo vệ kênh điều khiển TLS-Crypt và danh sách thu hồi chứng chỉ CRL
tls-crypt /etc/openvpn/server/ta.key
crl-verify /etc/openvpn/server/crl.pem

# Cấu hình dải mạng ảo riêng cho đường hầm Site-to-Site (10.9.0.0/24)
# HQ Gateway nhận IP 10.9.0.1, Branch Gateway nhận IP 10.9.0.2
server 10.9.0.0 255.255.255.0
topology subnet

# ------------------------------------------------------------------------------
# ĐỊNH TUYẾN MẠNG NỘI BỘ HAI CHIỀU (LAN-TO-LAN ROUTING)
# ------------------------------------------------------------------------------

# 1. Định tuyến mức OS (Kernel Routing): Báo cho nhân Linux trên HQ Gateway biết
#    mạng LAN Chi nhánh (192.168.20.0/24) phải đi qua interface tun1
route 192.168.20.0 255.255.255.0

# 2. Thư mục cấu hình riêng cho từng client (Client Config Directory - CCD):
#    Bắt buộc để nhân OpenVPN biết client nào đứng sau mạng 192.168.20.0/24
client-config-dir /etc/openvpn/ccd

# 3. Đẩy tuyến đường về mạng LAN Trụ sở (192.168.10.0/24) sang Branch Gateway
push "route 192.168.10.0 255.255.255.0"

# ------------------------------------------------------------------------------
# THÔNG SỐ MẬT MÃ & DUY TRÌ KẾT NỐI
# ------------------------------------------------------------------------------
cipher AES-256-GCM
auth SHA256

# Giảm đặc quyền tiến trình
user nobody
group nogroup
persist-key
persist-tun

# Cơ chế phát hiện mất kết nối (Dead Peer Detection)
keepalive 10 120

# Tệp lưu trạng thái kết nối và mức độ log
status /var/log/openvpn/openvpn-s2s-status.log
verb 3
