# ==============================================================================
# OpenVPN Client Configuration: Site-to-Site Routed Tunnel
# Triển khai trên: VM-Branch-GW (Văn phòng Chi nhánh)
# Đường dẫn hệ thống: /etc/openvpn/client/client-s2s.conf
# ==============================================================================

client
dev tun0
proto udp

# Địa chỉ IP WAN và cổng dịch vụ S2S của HQ Gateway
remote 172.16.1.10 1195

# Tự động thử lại kết nối khi đứt đường truyền
resolv-retry infinite
nobind

# Giữ trạng thái tài nguyên sau khi tunnel khởi động lại
persist-key
persist-tun

# Đường dẫn chứng chỉ X.509 và khóa của Branch Gateway
ca /etc/openvpn/client/ca.crt
cert /etc/openvpn/client/branch-gw.crt
key /etc/openvpn/client/branch-gw.key
tls-crypt /etc/openvpn/client/ta.key

# Xác thực định danh chứng chỉ phía máy chủ
remote-cert-tls server

# Bộ thuật toán mã hóa đối xứng và toàn vẹn dữ liệu
cipher AES-256-GCM
auth SHA256

# Giảm đặc quyền người dùng
user nobody
group nogroup

# Mức độ log chi tiết
verb 3
