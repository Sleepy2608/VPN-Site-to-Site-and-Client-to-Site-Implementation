# ==============================================================================
# OpenVPN Server Configuration: Client-to-Site (Remote Access)
# Triển khai trên: VM-HQ-GW (Trụ sở chính)
# Đường dẫn hệ thống: /etc/openvpn/server/server-c2s.conf
# ==============================================================================

# Cổng lắng nghe và giao thức truyền tải
# UDP được ưu tiên để giảm thiểu độ trễ và tránh hiện tượng TCP-over-TCP meltdown
port 1194
proto udp

# Tên interface ảo của đường hầm C2S
dev tun0

# Đường dẫn chứng chỉ và tham số mật mã X.509
ca /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/hq-c2s-server.crt
key /etc/openvpn/server/hq-c2s-server.key
dh /etc/openvpn/server/dh.pem

# Khóa bảo vệ kênh điều khiển TLS-Crypt (chống port scan và tấn công DoS)
tls-crypt /etc/openvpn/server/ta.key

# Tệp danh sách thu hồi chứng chỉ (CRL)
crl-verify /etc/openvpn/server/crl.pem

# Cấu hình dải mạng ảo cấp phát động cho Remote Client
server 10.8.0.0 255.255.255.0
topology subnet

# Lưu lại ánh xạ IP được cấp phát để tái sử dụng khi client kết nối lại
ifconfig-pool-persist /var/log/openvpn/ipp-c2s.txt

# Đẩy cấu hình định tuyến mạng nội bộ HQ cho client
push "route 192.168.10.0 255.255.255.0"
push "dhcp-option DNS 1.1.1.1"

# Cơ chế duy trì phiên kết nối (ping mỗi 10s, ngắt sau 120s không phản hồi)
keepalive 10 120

# Bộ thuật toán mã hóa đối xứng và toàn vẹn dữ liệu chuẩn an ninh cao
cipher AES-256-GCM
auth SHA256

# Giảm đặc quyền người dùng sau khi khởi tạo socket để tăng tính an toàn
user nobody
group nogroup

# Giữ trạng thái khóa và interface khi tunnel tái khởi động
persist-key
persist-tun

# Đường dẫn ghi log trạng thái kết nối của các client
status /var/log/openvpn/openvpn-c2s-status.log
verb 3

# Thông báo cho client khi máy chủ dừng hoạt động
explicit-exit-notify 1

